name: Generate cinematic scroll videos

on:
  push:
    branches:
      - cinematic-portfolio-v2
    paths:
      - scripts/generate-cinematic-videos.py
      - .github/workflows/generate-cinematic-videos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-scroll-video-generation
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out cinematic branch
        uses: actions/checkout@v4
        with:
          ref: cinematic-portfolio-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow numpy cairosvg
          ffmpeg -version

      - name: Optimize generator for cached browser frames and responsive seeking
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/generate-cinematic-videos.py")
          source = path.read_text()
          source = source.replace("import subprocess\n", "import subprocess\nfrom functools import lru_cache\n")
          source = source.replace("def radial_background(seed: int, pulse: float = 0.0)", "@lru_cache(maxsize=None)\ndef radial_background(seed: int, pulse: float = 0.0)")
          source = source.replace("def final_project_frame(project: tuple[int, str, str, str, str])", "@lru_cache(maxsize=None)\ndef final_project_frame(project: tuple[int, str, str, str, str])")
          source = source.replace("radial_background(777, pulse=progress)", "radial_background(777).copy()")
          source = source.replace("radial_background(project_id * 131 + 17, pulse=math.sin(progress * math.pi))", "radial_background(project_id * 131 + 17).copy()")
          source = source.replace(
              '"-an", "-c:v", "libx264", "-preset", "medium", "-crf", "25", "-pix_fmt", "yuv420p",',
              '"-an", "-c:v", "libx264", "-preset", "veryfast", "-crf", "24", "-g", "6", "-keyint_min", "6", "-sc_threshold", "0", "-pix_fmt", "yuv420p",',
          )
          path.write_text(source)
          PY

      - name: Render reversible scroll films
        run: python scripts/generate-cinematic-videos.py

      - name: Commit generated films only to cinematic branch
        run: |
          git config user.name "cinematic-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/cinematic/home-to-work.mp4 public/cinematic/project-*.mp4
          if git diff --cached --quiet; then
            echo "No generated video changes"
            exit 0
          fi
          git commit -m "Add deterministic scroll-scrub project films"
          git pull --rebase origin cinematic-portfolio-v2
          git push origin HEAD:cinematic-portfolio-v2
