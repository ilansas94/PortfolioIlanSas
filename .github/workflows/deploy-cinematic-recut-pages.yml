name: Deploy Cinematic Recut to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - cinematic-portfolio-recut-pages
    paths:
      - "app/**"
      - "components/cinematic-recut/**"
      - "public/**"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cinematic-recut-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cinematic-recut-github-pages
  cancel-in-progress: true

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated Pages branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Rewrite public-folder URLs for repository subpath
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "/Essets/": "/PortfolioIlanSas/Essets/",
              "/cinematic-recut/": "/PortfolioIlanSas/cinematic-recut/",
              "/cinematic-v3/": "/PortfolioIlanSas/cinematic-v3/",
          }
          extensions = {".html", ".js", ".css", ".json", ".svg"}
          for path in Path("out").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          Path("out/.nojekyll").touch()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
