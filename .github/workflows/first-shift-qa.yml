name: FIRST SHIFT integrated portfolio QA
on:
  pull_request:
    branches: [master]
    paths:
      - "components/Portfolio.tsx"
      - "public/first-shift/**"
      - "next.config.js"
      - "scripts/first-shift-qa.cjs"
      - ".github/workflows/first-shift-qa.yml"
permissions:
  contents: read
jobs:
  first-shift-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - name: Set up Chromium QA
        run: |
          mkdir -p /tmp/first-shift-qa
          npm install --prefix /tmp/first-shift-qa --no-save --no-audit --no-fund playwright@1.57.0
          node /tmp/first-shift-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run first shift interactions and screenshots
        run: |
          (pnpm start --port 3000 > /tmp/first-shift-server.log 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          NODE_PATH=/tmp/first-shift-qa/node_modules node scripts/first-shift-qa.cjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-shift-portfolio-qa
          path: first-shift-qa/
          if-no-files-found: warn
          retention-days: 3
